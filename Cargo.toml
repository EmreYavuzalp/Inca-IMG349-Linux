[package]
name = "img349ctl"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
description = "Linux configuration tool for the Inca IMG-349 gaming mouse"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/EmreYavuzalp/Inca-IMG349-Linux"
categories = ["command-line-utilities", "hardware-support"]

[features]
# Graphical app (img349ctl-gui). Off by default so the CLI builds without egui.
gui = ["dep:eframe", "dep:winit", "dep:log"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
eframe = { version = "0.31", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# GNOME-style title bar on Wayland, where the app has to draw its own.
winit = { version = "0.30", optional = true, default-features = false, features = ["wayland-csd-adwaita"] }
log = { version = "0.4", optional = true }

[[bin]]
name = "img349ctl"
path = "src/main.rs"

[[bin]]
name = "img349ctl-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[profile.release]
strip = true
lto = true
